<!DOCTYPE html>
<html lang ="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- <meta http-equiv="refresh" content="300">  // ここで refresh を使う代わりに末尾で safereload.js を使用 -->
    <script src="JS/loadmqtt.js"></script>
    <script>
      const _VERSION = "045AeX"; // ***重要*** // バージョンを更新したらここを書き換えること！
      document.title = `Clock00(new/${_VERSION})`;
    </script>
    <script>
      // URL引数を解析
      const params = new URLSearchParams(window.location.search);
      // URLのパス（例: "/.../clock00new-nojs-nocss.html"）を取得
      const path = window.location.pathname;
    
      // Debug 0. URL のパス
	console.log("URL path:", path);
      // Debug 1. 素のURL引数文字列（?nocss&nojs など）を確認したい場合
	console.log("Raw search:", window.location.search);
      // Debug 2. パラメータを通常の連想配列（オブジェクト）にして見やすく出力（最もおすすめ）
	console.log("Params object:", Object.fromEntries(params.entries()));
      // Debug 3. 特定のキーの判定結果を確認したい場合
	console.log("has nocss:", params.has('nocss'));
	console.log("has nojs:", params.has('nojs'));
	console.log("has nocolor:", params.has('nocolor'));

      // パス（ファイル）名またはパラメータのどちらでも判定できるようにする
      window.isNoCss   = path.includes('-nocss')   || params.has('nocss');
      window.isNoJs    = path.includes('-nojs')    || params.has('nojs');
      window.isNoColor = path.includes('-nocolor') || params.has('nocolor');
    
      // CSS読み込み判定
      if (!window.isNoCss) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'clock00new.css';
        document.head.appendChild(link);
      }
    </script>
</head>
<body>
    <!-- まずボタンがある     -->
    <div class="button-container"> 
        <input type="button" value="Push here to sync time" id="button1">
        <input type="button" value="Full Screen" id="button2">
    </div>

    <!-- 次に日時表示領域がある．ここが最重要 -->
    <div class="clock-container">
        <div class="clock">
            <p class="clock-date">（日付）</p>
            <p><span class="clock-time1">（時刻1）</span><span class="clock-time2">（時刻2）</span></p>
            <p class="clock-timezone">（TZ）</p>
        </div>
    </div>

    <!-- 時刻情報エリア -->
    <div class="display-container">
        <p id="RealtimeClockDisplayArea1">（ここに時刻情報を表示）</p>
        <p id="RealtimeClockDisplayArea2">（ここに時刻情報を表示）</p>
    </div>

    <!-- スクリプトの動的読み込み -->
    <script>
      if (!window.isNoJs) {
        <!-- 各領域を取り扱う Javascript を起動 -->
        const script1 = document.createElement('script');
        script1.src = 'debugX.js';
        document.body.appendChild(script1);
  
        <!-- 定期的に Javascript を読み込み直すため safereload.js（自作）を利用 -->
        <!-- 次のリロードは 10分後（以前は 3分後だった．徐々に延長中）-->
        const script2 = document.createElement('script');
        script2.src = 'JS/safereload.js';
        document.body.appendChild(script2);
      }
    </script>
  </body>
</html>
